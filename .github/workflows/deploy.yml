name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# GitHub configuration
#   Secrets:   YC_SA_KEY (bizmuzik-deployer JSON key), YC_REGISTRY_ID, YC_FOLDER_ID,
#              YC_DEPLOY_SA_ID (bizmuzik-runtime id), YC_LOCKBOX_SECRET_ID
#   Variables: YC_NETWORK_ID, NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_BASE_URL,
#              NEXT_PUBLIC_ENABLE_PHONE_VERIFICATION, NEXT_PUBLIC_YANDEX_MAPS_API_KEY,
#              NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY
# Runtime config lives in Lockbox: every key of the secret's current version is
# mounted as an env var of the same name.

env:
  IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/bizmusic:${{ github.sha }}
  CONTAINER_ID: bba69lnj92l01gtev1th
  # Minimum to boot and stream. Email (UNISENDER_GO_API_KEY), payments
  # (TBANK_*), AI and TTS keys are optional and mounted when present.
  REQUIRED_RUNTIME_KEYS: >-
    DATABASE_URL AUTH_SECRET CRON_SECRET
    S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY
    DOWNLOAD_EVENT_HASH_SALT

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          # Yandex Container Registry rejects OCI image indexes with attestations.
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_ENABLE_PHONE_VERIFICATION=${{ vars.NEXT_PUBLIC_ENABLE_PHONE_VERIFICATION }}
            NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}
            NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY=${{ vars.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          umask 077
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/key.json"
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"
          rm -f "$RUNNER_TEMP/key.json"

      # Prints only names and true/false checks, never IDs or secret values.
      - name: Check Yandex Cloud access
        continue-on-error: true
        env:
          FOLDER: ${{ secrets.YC_FOLDER_ID }}
          RUNTIME_SA: ${{ secrets.YC_DEPLOY_SA_ID }}
          REGISTRY: ${{ secrets.YC_REGISTRY_ID }}
          LOCKBOX_SECRET_ID: ${{ secrets.YC_LOCKBOX_SECRET_ID }}
        run: |
          check() {
            local label="$1"; shift
            if out=$("$@" 2>&1); then echo "OK    $label: $out"
            else echo "FAIL  $label: $(echo "$out" | grep -m1 -oE 'code = [A-Za-z]+' || echo "$out" | tail -1)"; fi
          }
          check "container (by id)" bash -c 'yc serverless container get --id "$CONTAINER_ID" --format json | jq -r "\"name=\(.name) in_YC_FOLDER_ID=\(.folder_id == env.FOLDER)\""'
          check "runtime service account" bash -c 'yc iam service-account get --id "$RUNTIME_SA" --format json | jq -r "\"name=\(.name) in_YC_FOLDER_ID=\(.folder_id == env.FOLDER)\""'
          check "registry" bash -c 'yc container registry get --id "$REGISTRY" --format json | jq -r "\"name=\(.name) in_YC_FOLDER_ID=\(.folder_id == env.FOLDER)\""'
          check "Lockbox secret" bash -c 'yc lockbox secret get --id "$LOCKBOX_SECRET_ID" --format json | jq -r "\"name=\(.name) in_YC_FOLDER_ID=\(.folder_id == env.FOLDER) kms=\(.kms_key_id // \"none\" | if . == \"none\" then \"none\" else \"set\" end)\""'
          check "deployer can read Lockbox payload" bash -c 'yc lockbox payload get --id "$LOCKBOX_SECRET_ID" --format json | jq -r "\"entries=\(.entries | length)\""'
          check "containers in YC_FOLDER_ID" bash -c 'yc serverless container list --format json | jq -r "map(.name) | join(\",\")"'

      - name: Deploy Serverless Container revision
        env:
          LOCKBOX_SECRET_ID: ${{ secrets.YC_LOCKBOX_SECRET_ID }}
        run: |
          set -euo pipefail
          # Metadata only (lockbox.viewer): version id + key names, never values.
          SECRET_JSON=$(yc lockbox secret get --id "$LOCKBOX_SECRET_ID" --format json)
          VERSION_ID=$(echo "$SECRET_JSON" | jq -r '.current_version.id')
          KEYS=$(echo "$SECRET_JSON" | jq -r '.current_version.payload_entry_keys[]')

          missing=()
          for key in $REQUIRED_RUNTIME_KEYS; do
            grep -qx "$key" <<< "$KEYS" || missing+=("$key")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Lockbox secret is missing required keys: ${missing[*]}"
            exit 1
          fi

          secret_flags=()
          while read -r key; do
            [ -n "$key" ] && secret_flags+=(--secret "environment-variable=$key,id=$LOCKBOX_SECRET_ID,version-id=$VERSION_ID,key=$key")
          done <<< "$KEYS"

          public_env="NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }},NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}"
          base=(
            --container-id "$CONTAINER_ID"
            --image "$IMAGE"
            --cores 1
            --core-fraction 100
            --memory 1GB
            --concurrency 8
            --execution-timeout 120s
            --min-instances 1
            --service-account-id "${{ secrets.YC_DEPLOY_SA_ID }}"
          )
          # Attach to the VPC so the container reaches Managed PostgreSQL privately
          # (security group allows 6432 from 10.0.0.0/8). Deployer needs vpc.user.
          if [ -n "${{ vars.YC_NETWORK_ID }}" ]; then
            base+=(--network-id "${{ vars.YC_NETWORK_ID }}")
          else
            echo "::warning::YC_NETWORK_ID is not set; the container cannot reach the database privately"
          fi

          if yc serverless container revision deploy "${base[@]}" --environment "$public_env" "${secret_flags[@]}"; then
            exit 0
          fi

          # Yandex refuses Lockbox mounts for this cloud (PermissionDenied) even though
          # both accounts can read the secret. Until resolved with YC support, read the
          # values here and pass them as plain env vars (visible to folder viewers).
          echo "::warning::Lockbox mount refused; passing secret values as environment variables"
          env_list="$public_env"
          while IFS= read -r line; do
            key="${line%%=*}"; b64="${line#*=}"
            [ -z "$key" ] && continue
            value=$(printf '%s' "$b64" | base64 -d)
            echo "::add-mask::$value"
            if [[ "$value" == *,* ]]; then
              echo "::error::Lockbox value for $key contains a comma, which yc --environment cannot pass"
              exit 1
            fi
            env_list="$env_list,$key=$value"
          done < <(yc lockbox payload get --id "$LOCKBOX_SECRET_ID" --version-id "$VERSION_ID" --format json \
                    | jq -r '.entries[] | "\(.key)=\(.text_value // "" | @base64)"')

          yc serverless container revision deploy "${base[@]}" --environment "$env_list"
